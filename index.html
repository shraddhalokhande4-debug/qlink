<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QLINK Application Portal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:#f4f6f9;
    padding:30px;
}

/* ==========================================
   QLINK HEADER
========================================== */

.site-header{
    background:linear-gradient(135deg,#081220,#0f2342,#162f5c);
    max-width:1200px;
    margin:0 auto 30px;
    padding:20px 30px;
    border-radius:18px;
    text-align:center;
    position:relative;
    overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
}

.site-header::before{
    content:'';
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:4px;
    background:linear-gradient(90deg,#ff003c,#ff4d6d,#ff003c);
}

.brand{
    height:90px;
    margin-bottom:10px;
    transition:0.3s ease;
}

.brand:hover{
    transform:scale(1.05);
}

.portal-title{
    color:white;
    font-weight:700;
    font-size:28px;
    letter-spacing:1px;
    margin-bottom:5px;
}

.portal-subtitle{
    color:#b7c6da;
    font-size:14px;
    margin-bottom:0;
}

/* ==========================================
   SECTION DROPDOWN
========================================== */

.section-select-wrap{
    max-width:1200px;
    margin:0 auto 25px;
    text-align:center;
}

.section-select{
    width:100%;
    max-width:450px;
    padding:12px 18px;
    font-size:15px;
    font-weight:600;
    border:none;
    border-radius:12px;
    background:white;
    color:#162f5c;
    box-shadow:0 5px 15px rgba(0,0,0,0.12);
}

.load-hint{
    display:none;
    margin-top:10px;
    color:#d6003f;
}

/* ==========================================
   FOLDER CARDS
========================================== */

.container{
    max-width:1200px;
    margin:auto;
}

.folder{
    background:white;
    border-radius:16px;
    overflow:hidden;
    margin-bottom:20px;
    display:none;
    box-shadow:0 6px 20px rgba(0,0,0,0.10);
}

.folder.active{
    display:block;
}

.folder-title{
    background:linear-gradient(135deg,#162f5c,#0f2342);
    color:white;
    padding:18px 20px;
    font-weight:700;
    font-size:18px;
}

.folder-content{
    padding:20px;
}

.links{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:15px;
}

.card{
    border:none;
    color:white;
    padding:18px;
    border-radius:14px;
    text-align:left;
    font-weight:600;
    cursor:pointer;
    transition:all .3s ease;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 8px 20px rgba(0,0,0,0.25);
}

/* CARD COLORS */

.grafana{
background:linear-gradient(135deg,#ff7b00,#ff9800);
}

.jira{
background:linear-gradient(135deg,#0052cc,#2684ff);
}

.confluence{
background:linear-gradient(135deg,#00a67e,#36b37e);
}

.doc{
background:linear-gradient(135deg,#6a11cb,#9c27b0);
}

.citrix{
background:linear-gradient(135deg,#ff9800,#ff5722);
}

.itsm{
background:linear-gradient(135deg,#00a8e8,#009688);
}

.argocd{
background:linear-gradient(135deg,#ef5350,#d32f2f);
}

.portal{
background:linear-gradient(135deg,#546e7a,#37474f);
}

.dashboard{
background:linear-gradient(135deg,#43a047,#1b5e20);
}

.sharepoint{
background:linear-gradient(135deg,#0078d4,#005a9e);
}

.audit{
background:linear-gradient(135deg,#8e24aa,#5e35b1);
}

/* ==========================================
   QLINK FOOTER
========================================== */

.site-footer{
    background:linear-gradient(135deg,#081220,#0f2342,#162f5c);
    color:white;
    text-align:center;
    max-width:1200px;
    margin:30px auto 0;
    padding:22px;
    border-radius:18px;
    border-top:3px solid #ff003c;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
}

.site-footer p{
    margin:0;
    color:#d8e0ea;
    letter-spacing:1px;
}

.footer-name{
    color:#ff295b;
    font-weight:700;
}

</style>
</head>

<body>

<!-- HEADER -->

<div class="site-header">

    <img class="brand" src="qlink.png" alt="QLINK Logo">

    <h1 class="portal-title">
        QLINK Application Portal
    </h1>

    <p class="portal-subtitle">
        Connecting Applications • Documents • Knowledge • Dashboards
    </p>

</div>

<!-- DROPDOWN -->

<div class="section-select-wrap">

    <select id="sectionSelect"
            class="section-select"
            onchange="showSection(this.value)">
    </select>

    <div id="loadHint" class="load-hint">
        Open this page using a local web server.
    </div>

</div>

<!-- DYNAMIC SECTIONS -->

<div class="container" id="sections">

</div>

<!-- FOOTER -->

<footer class="site-footer">

    <p>
        Design & Developed by
        <span class="footer-name">Shraddha Lokhande</span>
    </p>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
