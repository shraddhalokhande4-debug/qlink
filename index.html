<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vodafone Application Portal</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: #f4f6f9;
      padding: 30px;
    }

    .site-header {
      background: linear-gradient(90deg, #e60000, #990000);
      text-align: center;
      max-width: 1200px;
      margin: 0 auto 30px;
      padding: 8px 20px;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(153, 0, 0, 0.35);
    }

    .site-header .brand {
      height: 60px;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.3));
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .section-select-wrap {
      max-width: 1200px;
      margin: 0 auto 25px;
      text-align: center;
    }

    .section-select {
      width: 100%;
      max-width: 400px;
      padding: 12px 16px;
      font-size: 16px;
      font-weight: 600;
      color: #990000;
      border: 2px solid #e60000;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    }

    .folder {
      background: #fff;
      border-radius: 14px;
      margin-bottom: 20px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      display: none;
    }

    .load-hint {
      display: none;
      margin-top: 12px;
      font-size: 14px;
      color: #990000;
    }

    .folder.active {
      display: block;
    }

    .folder-title {
      width: 100%;
      padding: 18px 20px;
      text-align: left;
      border: none;
      color: white;
      font-size: 18px;
      font-weight: bold;
      background: linear-gradient(90deg, #e60000, #990000);
    }

    .folder-content {
      padding: 20px;
    }

    .links {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
    }

    .card {
      color: white;
      border: none;
      padding: 16px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      text-align: left;
      transition: all .3s ease;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.15);
    }

    .card:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }

    /* Color Themes */
    .grafana { background: linear-gradient(135deg, #f46800, #ff9800); }
    .jira { background: linear-gradient(135deg, #0052cc, #2684ff); }
    .confluence { background: linear-gradient(135deg, #36b37e, #009688); }
    .doc { background: linear-gradient(135deg, #6f42c1, #9c27b0); }
    .citrix { background: linear-gradient(135deg, #ff9800, #ff5722); }
    .itsm { background: linear-gradient(135deg, #00a8e8, #009688); }
    .argocd { background: linear-gradient(135deg, #ef5350, #d32f2f); }
    .portal { background: linear-gradient(135deg, #607d8b, #455a64); }
    .dashboard { background: linear-gradient(135deg, #4caf50, #2e7d32); }
    .sharepoint { background: linear-gradient(135deg, #0078d4, #005a9e); }
    .audit { background: linear-gradient(135deg, #8e24aa, #5e35b1); }

    .site-footer {
      background: linear-gradient(90deg, #e60000, #990000);
      color: #fff;
      text-align: center;
      max-width: 1200px;
      margin: 30px auto 0;
      padding: 16px 0;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(153, 0, 0, 0.35);
    }
  </style>

  <script>
    /* Dropdown entries live in sections/sections.json; each one points to its own JSON file. */
    var MANIFEST = "sections/sections.json";

    function showSection(id) {
      document.querySelectorAll(".folder").forEach(function (folder) {
        folder.classList.toggle("active", folder.id === id);
      });
    }

    function openLink(url) {
      window.open(url, "_blank", "noopener,noreferrer");
    }

    function getJson(url) {
      return fetch(url).then(function (response) {
        if (!response.ok) { throw new Error(response.status + " " + response.statusText); }
        return response.json();
      });
    }

    function buildCard(card) {
      var button = document.createElement("button");
      button.className = "card " + (card.theme || "portal");
      button.textContent = ((card.icon || "") + " " + (card.text || "")).trim();
      button.addEventListener("click", function () { openLink(card.url); });
      return button;
    }

    function buildFolder(section, data, error) {
      var folder = document.createElement("div");
      folder.className = "folder";
      folder.id = section.id;

      var title = document.createElement("div");
      title.className = "folder-title";
      title.textContent = (data && data.title) || section.label;
      folder.appendChild(title);

      var content = document.createElement("div");
      content.className = "folder-content";

      if (error) {
        content.textContent = "Could not load " + section.file + " (" + error.message + ")";
      } else {
        var links = document.createElement("div");
        links.className = "links";
        (data.cards || []).forEach(function (card) { links.appendChild(buildCard(card)); });
        content.appendChild(links);
      }

      folder.appendChild(content);
      return folder;
    }

    function init() {
      var select = document.getElementById("sectionSelect");
      var container = document.getElementById("sections");

      return getJson(MANIFEST).then(function (sections) {
        return Promise.all(sections.map(function (section) {
          return getJson(section.file)
            .then(function (data) { return { section: section, data: data }; })
            .catch(function (error) { return { section: section, error: error }; });
        }));
      }).then(function (loaded) {
        loaded.forEach(function (item) {
          var option = document.createElement("option");
          option.value = item.section.id;
          option.textContent = item.section.label || (item.data && item.data.title) || item.section.id;
          select.appendChild(option);

          container.appendChild(buildFolder(item.section, item.data, item.error));
        });
        if (loaded.length) { showSection(loaded[0].section.id); }
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      init().catch(function () {
        document.getElementById("loadHint").style.display = "block";
      });
      if (location.protocol === "file:") {
        document.getElementById("loadHint").style.display = "block";
      }
    });
  </script>
</head>

<body>

  <div class="site-header">
    <img class="brand" src="qlink.png" alt="qlink">
  </div>

  <div class="section-select-wrap">
    <select id="sectionSelect" class="section-select" onchange="showSection(this.value)"></select>
    <div id="loadHint" class="load-hint">
      Sections are loaded from the <code>sections JSON files, so open this page through a web server
      (for example <code>python -m http.server</code>) instead of double-clicking the file.
    </div>
  </div>

  <div class="container" id="sections"></div>

  <footer class="site-footer">
    <p class="mb-0">Design and Develop by Rahul Bhosale</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html></code>
